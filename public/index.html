<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No Thanks! Online</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#10131b;color:#f5f7fb;min-height:100vh}button,input{font:inherit}button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1180px;margin:auto;padding:24px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand h1{margin:0;font-size:28px}.brand small{color:#9ba4b5}.panel{background:#181d28;border:1px solid #2b3240;border-radius:18px;padding:22px;box-shadow:0 15px 45px #0004}.center{max-width:520px;margin:8vh auto}.field{display:flex;gap:10px;margin:12px 0}.field input{flex:1;background:#0e1118;color:#fff;border:1px solid #303847;border-radius:12px;padding:12px}.primary{background:#f1c84b;color:#19160a}.secondary{background:#2a3140;color:#fff}.danger{background:#9e3c46;color:#fff}.muted{color:#a8b0bf}.code{font-size:30px;letter-spacing:7px;font-weight:900;background:#0e1118;border:1px dashed #4a5365;padding:12px 18px;border-radius:14px;text-align:center}.lobby{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.players{display:grid;gap:9px;margin:15px 0}.player{display:flex;align-items:center;justify-content:space-between;background:#10141c;padding:12px 14px;border-radius:12px}.badge{font-size:12px;color:#b8c1d2}.game{display:grid;grid-template-columns:1fr 310px;gap:16px}.table{min-height:600px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,#293342 0,#171c26 50%,#11151d 100%);border:1px solid #303847;border-radius:22px;overflow:hidden}.card{width:150px;height:210px;border-radius:18px;background:#f4f0df;color:#151515;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:17px;box-shadow:0 15px 30px #0007;border:4px solid #c8c0a6}.card .num{font-size:66px;font-weight:1000;line-height:1}.card .label{font-weight:900;color:#575042}.pot{font-size:20px;font-weight:900;margin:18px}.actions{display:flex;gap:12px}.actions button{min-width:145px;font-size:17px}.side{display:flex;flex-direction:column;gap:14px}.side h3{margin:0}.scoreboard{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;background:#10141c;border-radius:10px;padding:10px}.turn{outline:2px solid #f1c84b}.coins{color:#f1c84b;font-weight:900}.cards{color:#aeb7c7;font-size:12px}.log{max-height:210px;overflow:auto;display:grid;gap:5px;font-size:12px;color:#aeb7c7}.notice{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f4f6fa;color:#12151b;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px #0008;display:none;z-index:5}.rules{line-height:1.55;font-size:13px;color:#b9c1cf}.winner{font-size:22px;font-weight:900;color:#f1c84b}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.hidden{display:none!important}@media(max-width:850px){.lobby,.game{grid-template-columns:1fr}.table{min-height:500px}.side{order:-1}.app{padding:12px}.card{width:125px;height:175px}.card .num{font-size:54px}.actions button{min-width:0;flex:1}}
</style></head><body><div class="app"><div class="brand"><div><h1>🪙 No Thanks!</h1><small>Chơi online cùng bạn bè</small></div><div id="status" class="muted"></div></div><main id="root"></main></div><div id="notice" class="notice"></div><script>
const root=document.getElementById('root'), notice=document.getElementById('notice'), statusEl=document.getElementById('status');let ws=null,me=null,room=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(s){notice.textContent=s;notice.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>notice.style.display='none',2400)}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>statusEl.textContent='● Đã kết nối';ws.onclose=()=>{statusEl.textContent='○ Mất kết nối';toast('Mất kết nối máy chủ')};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){me=m.playerId;localStorage.setItem('nt_room',m.room);localStorage.setItem('nt_pid',me)}else if(m.type==='state'){room=m.state;render()}else if(m.type==='error')toast(m.message);else if(m.type==='kicked'){toast('Bạn đã bị chủ phòng kick');setTimeout(()=>location.reload(),900)}}}
function send(type,p={}){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type,...p}))}
function render(){if(!room){root.innerHTML=`<section class="panel center"><h2>Tạo phòng chơi</h2><p class="muted">3–7 người • Realtime • Có thể thêm bot</p><div class="field"><input id="name" maxlength="20" placeholder="Tên của bạn" value="${esc(localStorage.getItem('nt_name')||'')}"/><button class="primary" onclick="create()">Tạo phòng</button></div><div class="field"><input id="code" maxlength="5" placeholder="Mã phòng"/><button class="secondary" onclick="join()">Vào phòng</button></div><div class="rules"><b>Cách chơi:</b> mỗi lượt một lá bài được lật. Bạn chọn <b>LẤY</b> để nhận lá + toàn bộ xu trên bàn, hoặc <b>BỎ</b> để trả 1 xu. Cuối ván, các dãy số liên tiếp chỉ tính lá nhỏ nhất; trừ xu còn lại khỏi điểm. Điểm thấp nhất thắng.</div></section>`;return}if(room.state==='lobby')renderLobby();else renderGame()}
function getName(){const n=document.getElementById('name')?.value.trim()||'Người chơi';localStorage.setItem('nt_name',n);return n}
function create(){if(!ws||ws.readyState!==1)return toast('Đang kết nối...');send('create',{name:getName()})}
function join(){const n=getName(),c=document.getElementById('code').value.trim().toUpperCase();if(c.length<4)return toast('Nhập mã phòng');send('join',{name:n,code:c})}
function renderLobby(){const host=room.hostId===me;root.innerHTML=`<section class="lobby"><div class="panel"><div class="topline"><div><h2 style="margin:0">Phòng chờ</h2><span class="muted">Chia sẻ mã này cho bạn bè</span></div><div class="code">${esc(room.code)}</div></div><div class="players">${room.players.map((p,i)=>`<div class="player"><div><b>${esc(p.name)}</b> ${p.id===room.hostId?'👑':''} ${p.id===me?'(Bạn)':''}<div class="badge">${p.bot?'🤖 Bot':'👤 Người chơi'} ${!p.connected&&!p.bot?'• đã ngắt kết nối':''}</div></div>${host&&p.id!==me?`<button class="danger" onclick="kick('${p.id}')">Kick</button>`:''}</div>`).join('')}</div><div class="field"><button class="secondary" onclick="copyCode()">📋 Sao chép mã</button>${host?`<button class="secondary" onclick="addBot()">+ Thêm bot</button><button class="primary" onclick="start()" ${room.players.length<3?'disabled':''}>▶ Bắt đầu</button>`:''}</div><p class="muted">Cần ít nhất 3 người. Tối đa 7 người.</p></div><aside class="panel rules"><h3>Luật nhanh</h3><ol><li>Mỗi người bắt đầu với 11 xu.</li><li>Bộ bài gồm 3–35, bỏ ngẫu nhiên 9 lá.</li><li>Khi lá mới xuất hiện, người tới lượt chọn lấy hoặc bỏ.</li><li>Bỏ = trả 1 xu vào giữa bàn. Hết xu thì bắt buộc lấy.</li><li>Nhận bài sẽ lấy luôn toàn bộ xu giữa bàn.</li><li>Dãy liên tiếp chỉ tính lá nhỏ nhất.</li><li>Điểm thấp nhất thắng.</li></ol></aside></section>`}
function copyCode(){navigator.clipboard?.writeText(room.code);toast('Đã sao chép mã phòng')};function start(){send('start')};function addBot(){send('addBot')};function kick(id){if(confirm('Kick người chơi này?'))send('kick',{playerId:id})}
function renderGame(){const p=room.players.find(x=>x.id===me),turn=room.players[room.turn],myTurn=turn?.id===me,finished=room.state==='finished';root.innerHTML=`<section class="game"><div class="table"><div class="muted">${finished?'KẾT THÚC VÁN':myTurn?'ĐẾN LƯỢT BẠN':'Lượt của '+esc(turn?.name||'—')}</div>${room.current!=null?`<div class="card"><div class="label">LÁ BÀI</div><div class="num">${room.current}</div><div class="label">NO THANKS!</div></div>`:`<div class="winner">🏆 Ván đã kết thúc</div>`}<div class="pot">🪙 ${room.pot} xu trên bàn</div>${finished?`<div class="winner">${esc(room.players.find(x=>x.id===room.winner)?.name||'')} thắng!</div>`:`<div class="actions"><button class="primary" onclick="take()" ${myTurn?'':'disabled'}>LẤY BÀI</button><button class="secondary" onclick="pass()" ${myTurn&&p.chips>0?'':'disabled'}>BỎ · −1 🪙</button></div>`}</div><aside class="side"><div class="panel"><div class="topline"><h3>Người chơi</h3><span class="muted">${room.deckCount} lá còn lại</span></div><div class="scoreboard">${room.players.map(x=>`<div class="row ${x.id===turn?.id&&!finished?'turn':''}"><div><b>${esc(x.name)}</b>${x.id===me?' 👤':''}<div class="cards">${x.cards.length?x.cards.join(', '):'Chưa có bài'}</div></div><div class="coins">🪙 ${x.chips}</div><div>${finished?`<b>${x.score}</b>`:''}</div></div>`).join('')}</div>${finished&&room.hostId===me?`<button class="primary" style="width:100%;margin-top:12px" onclick="restart()">↻ Chơi lại</button>`:''}</div><div class="panel"><h3>Lịch sử</h3><div class="log">${room.history.slice().reverse().map(h=>`<div>${h.action==='pass'?'↪ '+esc(h.player)+' bỏ · 1 xu':`🃏 ${esc(h.player)} lấy ${h.card} · +${h.pot} xu`}</div>`).join('')}</div></div><div class="panel rules"><b>Bạn:</b> ${esc(p?.name)}<br><b>Xu:</b> ${p?.chips} 🪙<br><b>Bài:</b> ${p?.cards.join(', ')||'—'}</div></aside></section>`}
function take(){send('take')};function pass(){send('pass')};function restart(){send('restart')}
connect();render();
</script></body></html>
