<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No Thanks! Online</title>
<style>
*{box-sizing:border-box}
:root{--text:#17191c;--muted:#73777d;--line:#e7e8ea;--soft:#f7f7f5;--yellow:#f3c33f;--red:#e94b4b;--green:#16a66a}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:var(--text);min-height:100vh}
button,input{font:inherit}button{border:1px solid var(--line);border-radius:9px;padding:10px 15px;background:#fff;color:var(--text);font-weight:750;cursor:pointer;transition:.15s}button:hover:not(:disabled){border-color:#cfd1d4;background:#fafafa}button:disabled{opacity:.38;cursor:not-allowed}
.app{max-width:1380px;margin:auto;padding:18px 22px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:4px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand-left{display:flex;align-items:center;gap:12px}.logo{font-size:28px;line-height:1}.brand h1{margin:0;font-size:24px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);margin-top:2px;font-size:12px}.status{font-size:12px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.center{max-width:520px;margin:9vh auto}.field{display:flex;gap:8px;margin:10px 0}.field input{flex:1;min-width:0;background:#fff;color:var(--text);border:1px solid #d9dade;border-radius:9px;padding:11px 12px;outline:none}.field input:focus{border-color:#aaa}
.primary{background:var(--yellow);border-color:var(--yellow);color:#191713}.primary:hover:not(:disabled){background:#edbb32;border-color:#edbb32}.secondary{background:#fff}.danger{background:#fff;border-color:#f0caca;color:#c83c3c}.code{font-size:20px;letter-spacing:4px;font-weight:850;background:var(--soft);padding:9px 14px;border-radius:8px;text-align:center}
.lobby{display:grid;grid-template-columns:1.45fr .8fr;gap:14px}.players{display:grid;gap:6px;margin:14px 0}.player{display:flex;align-items:center;justify-content:space-between;background:#fafafa;border:1px solid var(--line);padding:10px 12px;border-radius:9px}.badge{font-size:11px;color:var(--muted);margin-top:2px}.rules{line-height:1.55;font-size:13px;color:#5e6369}.rules h3{margin:0 0 8px;color:var(--text)}
.game{display:grid;grid-template-columns:230px minmax(420px,1fr) 300px;gap:14px;align-items:stretch}.game-left,.game-right{display:flex;flex-direction:column;gap:12px;min-width:0}
.table{min-height:680px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafaf8;border:1px solid var(--line);border-radius:12px;padding:28px 20px}.turn-title{font-size:13px;color:var(--muted);margin-bottom:18px}.table-card{width:170px;height:235px;border-radius:13px;background:#fff;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:15px;border:1px solid #dcdedf;box-shadow:0 10px 28px rgba(0,0,0,.06)}.table-card .num{font-size:76px;font-weight:900;line-height:1;margin:auto}.table-card .label{font-size:10px;letter-spacing:1.5px;font-weight:800;color:#999}.pot{font-size:15px;font-weight:750;color:#555;margin:16px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(420px,100%)}.actions button{font-size:14px;padding:12px 10px}.pause-btn{grid-column:1;background:#fff}.end-btn{grid-column:2;background:#fff;color:#d43e3e;border-color:#f0d0d0}.pause-banner{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.7px;color:#9a7515;font-weight:800}.winner{font-size:21px;font-weight:850;text-align:center}.muted{color:var(--muted)}
.score-panel{height:100%;display:flex;flex-direction:column}.side-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.side-title h3{margin:0;font-size:15px}.deck-count{font-size:11px;color:var(--muted)}.scoreboard{display:grid;gap:6px;overflow:auto}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;background:#fafafa;border:1px solid var(--line);border-radius:9px;padding:9px 10px}.row.turn{border-color:#e4c55e;background:#fffdf5}.player-name{font-size:13px;font-weight:750}.coins{font-size:13px;font-weight:800;white-space:nowrap}.cards{display:flex;flex-direction:column;gap:5px;margin-top:7px;max-height:205px;overflow:auto}.card-groups{display:flex;flex-direction:column;gap:6px}.card-group{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.run{display:flex;gap:2px;padding:2px;border-radius:6px;background:#f0f1f2}.mini-card{background:#fff;border:1px solid #d8dade;border-radius:5px;padding:4px 7px;font-size:12px;font-weight:750;text-align:center;min-width:34px}
.chat{height:335px;display:flex;flex-direction:column}.chat h3{margin:0 0 9px;font-size:15px}.chat-log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:2px;margin-bottom:8px}.msg{max-width:94%;background:#f3f4f5;border-radius:8px;padding:7px 9px}.msg.me{align-self:flex-end;background:#fff8dc}.msg b{display:block;font-size:11px;margin-bottom:2px}.msg span{font-size:12px;word-break:break-word}.chat-form{display:flex;gap:6px}.chat-form input{min-width:0;flex:1;border:1px solid #d9dade;border-radius:8px;padding:8px 9px;outline:none}.chat-form button{padding:8px 12px;font-size:12px}
.my-info{font-size:12px;color:#555}.my-info strong{color:var(--text)}
.notice{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17191c;color:#fff;padding:9px 14px;border-radius:8px;font-size:12px;display:none;z-index:5}
.topbar-game{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.room-mini{font-size:12px;color:var(--muted)}.room-mini b{color:var(--text);letter-spacing:1px}.game-controls{display:flex;gap:6px}.game-controls button{font-size:12px;padding:7px 10px}
@media(max-width:1050px){.game{grid-template-columns:200px minmax(360px,1fr)}.game-right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.chat{height:300px}}
@media(max-width:760px){.game{grid-template-columns:1fr}.game-left,.game-right{grid-column:auto}.game-right{display:flex}.table{min-height:560px}.app{padding:12px}.brand{align-items:flex-start}.game-controls{flex-wrap:wrap;justify-content:flex-end}.table-card{width:145px;height:205px}.table-card .num{font-size:64px}.actions{width:100%}.lobby{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="brand-left"><div class="logo">🪙</div><div><h1>No Thanks!</h1><small>Chơi online cùng bạn bè</small></div></div>
    <div id="status" class="status"></div>
  </div>
  <main id="root"></main>
</div>
<div id="notice" class="notice"></div>
<script>
const root=document.getElementById('root'),notice=document.getElementById('notice'),statusEl=document.getElementById('status');let ws=null,me=null,room=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(s){notice.textContent=s;notice.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>notice.style.display='none',2400)}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>statusEl.textContent='● Đã kết nối';ws.onclose=()=>{statusEl.textContent='○ Mất kết nối';toast('Mất kết nối máy chủ')};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){me=m.playerId;localStorage.setItem('nt_room',m.room);localStorage.setItem('nt_pid',me)}else if(m.type==='state'){room=m.state;render()}else if(m.type==='error')toast(m.message);else if(m.type==='kicked'){toast('Bạn đã bị chủ phòng kick');setTimeout(()=>location.reload(),900)}}}
function send(type,p={}){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type,...p}))}
function getName(){const n=document.getElementById('name')?.value.trim()||'Người chơi';localStorage.setItem('nt_name',n);return n}
function create(){if(!ws||ws.readyState!==1)return toast('Đang kết nối...');send('create',{name:getName()})}
function join(){const n=getName(),c=document.getElementById('code').value.trim().toUpperCase();if(c.length<4)return toast('Nhập mã phòng');send('join',{name:n,code:c})}
function render(){if(!room){root.innerHTML=`<section class="panel center"><h2>Tạo phòng chơi</h2><p class="muted">3–7 người · Realtime · Có thể thêm bot</p><div class="field"><input id="name" maxlength="20" placeholder="Tên của bạn" value="${esc(localStorage.getItem('nt_name')||'')}"/><button class="primary" onclick="create()">Tạo phòng</button></div><div class="field"><input id="code" maxlength="5" placeholder="Mã phòng"/><button class="secondary" onclick="join()">Vào phòng</button></div><div class="rules"><b>Cách chơi:</b> mỗi lượt một lá bài được lật. Bạn chọn <b>LẤY</b> để nhận lá + toàn bộ xu trên bàn, hoặc <b>BỎ</b> để trả 1 xu. Cuối ván, các dãy số liên tiếp chỉ tính lá nhỏ nhất; trừ xu còn lại khỏi điểm. Điểm thấp nhất thắng.</div></section>`;return}if(room.state==='lobby')renderLobby();else renderGame()}
function renderLobby(){const host=room.hostId===me;root.innerHTML=`<section class="lobby"><div class="panel"><div class="topline"><div><h2 style="margin:0">Phòng chờ</h2><span class="muted">Chia sẻ mã này cho bạn bè</span></div><div class="code">${esc(room.code)}</div></div><div class="players">${room.players.map(p=>`<div class="player"><div><b>${esc(p.name)}</b> ${p.id===room.hostId?'👑':''} ${p.id===me?'(Bạn)':''}<div class="badge">${p.bot?'🤖 Bot':'👤 Người chơi'} ${!p.connected&&!p.bot?'· đã ngắt kết nối':''}</div></div>${host&&p.id!==me?`<button class="danger" onclick="kick('${p.id}')">Kick</button>`:''}</div>`).join('')}</div><div class="field"><button class="secondary" onclick="copyCode()">Sao chép mã</button>${host?`<button class="secondary" onclick="addBot()">+ Thêm bot</button><button class="primary" onclick="start()" ${room.players.length<3?'disabled':''}>Bắt đầu</button>`:''}</div><p class="muted">Cần ít nhất 3 người. Tối đa 7 người.</p></div><aside class="panel rules"><h3>Luật nhanh</h3><ol><li>Mỗi người bắt đầu với 11 xu.</li><li>Bộ bài gồm 3–35, bỏ ngẫu nhiên 9 lá.</li><li>Khi lá mới xuất hiện, người tới lượt chọn lấy hoặc bỏ.</li><li>Bỏ = trả 1 xu vào giữa bàn. Hết xu thì bắt buộc lấy.</li><li>Nhận bài sẽ lấy luôn toàn bộ xu giữa bàn.</li><li>Dãy liên tiếp chỉ tính lá nhỏ nhất.</li><li>Điểm thấp nhất thắng.</li></ol></aside></section>`}
function copyCode(){navigator.clipboard?.writeText(room.code);toast('Đã sao chép mã phòng')}function start(){send('start')}function addBot(){send('addBot')}function kick(id){if(confirm('Kick người chơi này?'))send('kick',{playerId:id})}
function groupedCards(cards){const s=[...(cards||[])].sort((a,b)=>a-b),singles=[],runs=[];let i=0;while(i<s.length){let j=i;while(j+1<s.length&&s[j+1]===s[j]+1)j++;const group=s.slice(i,j+1);if(group.length===1)singles.push(group[0]);else runs.push(group);i=j+1}return{singles,runs}}
function cardsColumn(cards){const g=groupedCards(cards);if(!g.singles.length&&!g.runs.length)return '';return `<div class="card-groups"><div class="card-group">${g.singles.map(n=>`<div class="mini-card">${n}</div>`).join('')}</div>${g.runs.map(run=>`<div class="card-group"><div class="run">${run.map(n=>`<div class="mini-card">${n}</div>`).join('')}</div></div>`).join('')}</div>`}
function renderGame(){const p=room.players.find(x=>x.id===me),turn=room.players[room.turn],myTurn=turn?.id===me,finished=room.state==='finished',paused=room.paused&&!finished;root.innerHTML=`<div class="topbar-game"><div class="room-mini">Phòng <b>${esc(room.code)}</b> · ${room.players.length}/${room.players.length<7?7:room.players.length} người</div><div class="game-controls"><button class="pause-btn" onclick="pauseGame()">${paused?'Tiếp tục':'Tạm dừng'}</button><button class="end-btn" onclick="endGame()">Kết thúc</button></div></div><section class="game"><aside class="game-left"><div class="panel score-panel"><div class="side-title"><h3>Người chơi</h3><span class="deck-count">${room.deckCount} lá</span></div><div class="scoreboard">${room.players.map(x=>`<div class="row ${x.id===turn?.id&&!finished&&!paused?'turn':''}"><div><div class="player-name">${esc(x.name)}${x.id===me?' · Bạn':''}</div><div class="cards">${cardsColumn(x.cards)}</div></div><div class="coins">🪙 ${x.chips}${finished?`<div class="muted" style="font-size:10px;text-align:right">${x.score}</div>`:''}</div></div>`).join('')}</div></div></aside><div class="table">${paused?`<div class="pause-banner">VÁN ĐANG TẠM DỪNG</div>`:''}<div class="turn-title">${finished?'KẾT THÚC VÁN':myTurn?'ĐẾN LƯỢT BẠN':'LƯỢT CỦA '+esc(turn?.name||'—')}</div>${room.current!=null?`<div class="table-card"><div class="label">LÁ BÀI</div><div class="num">${room.current}</div><div class="label">NO THANKS!</div></div>`:`<div class="winner">Ván đã kết thúc</div>`}<div class="pot">🪙 ${room.pot} xu trên bàn</div>${finished?`<div class="winner">${esc(room.players.find(x=>x.id===room.winner)?.name||'')} thắng!</div>`:`<div class="actions"><button class="primary" onclick="take()" ${myTurn&&!paused?'':'disabled'}>LẤY BÀI</button><button onclick="pass()" ${myTurn&&p.chips>0&&!paused?'':'disabled'}>BỎ · −1 🪙</button><button class="pause-btn" onclick="pauseGame()">${paused?'TIẾP TỤC':'TẠM DỪNG'}</button><button class="end-btn" onclick="endGame()">KẾT THÚC</button></div>`}</div><aside class="game-right"><div class="panel chat"><h3>Trò chuyện</h3><div id="chatLog" class="chat-log">${(room.chat||[]).map(h=>`<div class="msg ${h.playerId===me?'me':''}"><b>${esc(h.player)}${h.playerId===me?' · Bạn':''}</b><span>${esc(h.text)}</span></div>`).join('')}</div><form class="chat-form" onsubmit="sendChat(event)"><input id="chatInput" maxlength="300" autocomplete="off" placeholder="Nhập tin nhắn..."/><button class="primary">Gửi</button></form></div><div class="panel my-info"><strong>${esc(p?.name)}</strong> · ${p?.chips} xu<div style="margin-top:7px"><strong>Bài của bạn</strong><div class="cards">${cardsColumn(p?.cards||[])}</div></div>${finished&&room.hostId===me?`<button class="primary" style="width:100%;margin-top:10px" onclick="restart()">Chơi lại</button>`:''}</div></aside></section>`;const log=document.getElementById('chatLog');if(log)log.scrollTop=log.scrollHeight}
function sendChat(e){e.preventDefault();const input=document.getElementById('chatInput');if(input?.value.trim()){send('chat',{text:input.value.trim()});input.value='';input.focus()}}function take(){send('take')}function pass(){send('pass')}function pauseGame(){send('pause')}function endGame(){if(confirm('Kết thúc ván chơi ngay? Tất cả người chơi sẽ xem kết quả hiện tại.'))send('end')}function restart(){send('restart')}
connect();render();
</script>
</body>
</html>
