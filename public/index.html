<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No Thanks! Online</title><style>
*{box-sizing:border-box}:root{--text:#20242a;--muted:#7b8189;--line:#e8eaed;--yellow:#f4c542;--green:#18a968;--red:#e94b4b}body{margin:0;background:#fff;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1250px;margin:auto;padding:16px 20px}.top{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.logo{font-size:26px}.brand h1{font-size:23px;margin:0}.brand small,.status,.muted{color:var(--muted);font-size:12px}.gamebar{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:10px}.room{background:#f6f7f9;border-radius:10px;padding:10px 16px;color:#69717b;font-size:13px}.room b{color:#1e4f9a;letter-spacing:1px}.room span{margin-left:10px}.game-controls{display:flex;gap:7px}.game-controls button{padding:9px 14px;font-size:13px}.pause{background:var(--green);border-color:var(--green);color:#fff}.end{background:var(--red);border-color:var(--red);color:#fff}.layout{display:grid;grid-template-columns:275px minmax(440px,1fr) 300px;gap:12px}.panel{border:1px solid var(--line);border-radius:12px;background:#fff}.players{padding:12px}.panel-title{font-size:16px;font-weight:850;margin:0 0 10px}.player{padding:10px 9px;border:1px solid transparent;border-radius:9px;margin-bottom:6px;background:#fafbfc}.player.turn{border-color:#e7c34b;background:#fffdf4}.phead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}.coins{font-size:13px;color:#d39400}.secret{font-size:11px;color:#9aa0a7;font-weight:600}.card-section{margin-top:6px}.card-label{font-size:11px;color:#5d6670;margin:4px 0}.card-row{display:flex;flex-wrap:wrap;gap:4px}.mini{min-width:38px;text-align:center;background:#fff;border:1px solid #d9dde2;border-radius:6px;padding:5px 7px;font-size:12px;font-weight:800}.run{display:flex;gap:2px;background:#f0f2f4;border-radius:6px;padding:2px}.you{color:#6d7480;font-weight:500;font-size:11px}.deck{font-size:11px;color:var(--muted)}.table{min-height:600px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative}.turn-title{font-size:15px;font-weight:850;margin-bottom:22px}.turn-title span{font-weight:500;color:var(--muted)}.main-card{width:185px;height:255px;border:1px solid #d9dadd;border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px;box-shadow:0 7px 20px rgba(0,0,0,.06)}.main-card .label{font-size:10px;color:#a0a4aa;letter-spacing:1.2px;font-weight:800}.main-card .number{font-size:76px;font-weight:950}.pot{margin:16px 0 20px;font-size:14px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(440px,100%)}.action{font-size:14px;padding:13px 10px;color:#fff;border-color:transparent}.take{background:var(--green)}.pass{background:var(--red)}.paused{position:absolute;top:16px;color:#9b7612;font-size:11px;font-weight:900}.info{margin-top:10px;width:min(440px,100%);padding:9px 12px;border:1px solid #d7e6ef;background:#f4f9fc;border-radius:8px;color:#5d7380;font-size:12px}.winner{font-size:21px;font-weight:900;margin:15px}.replay{margin-top:10px;background:var(--yellow);border-color:var(--yellow)}.right{display:flex;flex-direction:column;gap:12px}.chat{height:365px;padding:12px;display:flex;flex-direction:column}.chat h3{font-size:16px;margin:0 0 10px}.chat-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}.msg{font-size:12px;background:#f4f5f7;border-radius:9px;padding:7px 9px}.msg.me{align-self:flex-end;background:#fff7d7}.msg b{display:block;font-size:11px}.chat-form{display:flex;gap:6px;margin-top:8px}.chat-form input{min-width:0;flex:1;border:1px solid #d9dde2;border-radius:8px;padding:8px}.chat-form button{padding:8px 12px;background:#2374d8;color:#fff;border-color:#2374d8}.my{padding:12px;font-size:12px;line-height:1.7}.notice{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#20242a;color:#fff;border-radius:8px;padding:9px 14px;font-size:12px}.lobby{max-width:800px;margin:8vh auto}.field{display:flex;gap:8px;margin:10px 0}.field input{flex:1;border:1px solid #d9dde2;border-radius:9px;padding:11px}.primary{background:var(--yellow);border-color:var(--yellow)}.rules{padding:16px;font-size:13px;line-height:1.55}@media(max-width:1050px){.layout{grid-template-columns:240px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}}@media(max-width:760px){.app{padding:10px}.layout{grid-template-columns:1fr}.right{display:flex;grid-column:auto}.gamebar{flex-wrap:wrap}.room{width:100%;text-align:center}.table{min-height:500px}.actions{width:100%}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">🪙</div><div><h1>No Thanks!</h1><small>Chơi online cùng bạn bè</small></div></div><div id="status" class="status"></div></header><main id="root"></main></div><div id="notice" class="notice"></div><script>
const root=document.getElementById('root'),notice=document.getElementById('notice'),statusEl=document.getElementById('status');let ws=null,me=null,room=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function toast(s){notice.textContent=s;notice.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>notice.style.display='none',2200)}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>statusEl.textContent='● Đã kết nối';ws.onclose=()=>statusEl.textContent='○ Mất kết nối';ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined')me=m.playerId;else if(m.type==='state'){room=m.state;render()}else if(m.type==='error')toast(m.message);else if(m.type==='kicked')location.reload()}}function send(type,p={}){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type,...p}))}function getName(){return document.getElementById('name')?.value.trim()||'Người chơi'}function create(){send('create',{name:getName()})}function join(){send('join',{name:getName(),code:document.getElementById('code').value.trim().toUpperCase()})}function render(){if(!room){root.innerHTML='<section class="panel lobby" style="padding:18px"><h2>Tạo phòng chơi</h2><p class="muted">3–7 người · Xu của mỗi người là bí mật</p><div class="field"><input id="name" placeholder="Tên của bạn"><button class="primary" onclick="create()">Tạo phòng</button></div><div class="field"><input id="code" placeholder="Mã phòng"><button onclick="join()">Vào phòng</button></div><div class="rules"><b>Luật nhanh:</b> Lấy bài = nhận lá + xu trên bàn. Từ chối = bỏ 1 xu. Dãy liên tiếp chỉ tính lá nhỏ nhất. Trừ xu còn lại, điểm thấp nhất thắng.</div></section>';return}if(room.state==='lobby')renderLobby();else renderGame()}function renderLobby(){const host=room.hostId===me;root.innerHTML='<section class="lobby panel" style="padding:18px"><h2>Phòng '+esc(room.code)+'</h2>'+room.players.map(p=>'<div class="player"><b>'+esc(p.name)+'</b> '+(p.id===room.hostId?'👑':'')+'</div>').join('')+'<div class="field">'+(host?'<button onclick="addBot()">+ Bot</button><button class="primary" onclick="start()" '+(room.players.length<3?'disabled':'')+'>Bắt đầu</button>':'')+'</div></section>'}function grouped(cards){const s=[...(cards||[])].sort((a,b)=>a-b),single=[],runs=[];let i=0;while(i<s.length){let j=i;while(j+1<s.length&&s[j+1]===s[j]+1)j++;const g=s.slice(i,j+1);(g.length===1?single:runs).push(g);i=j+1}return{single,runs}}function cardGroups(cards){const g=grouped(cards);return '<div class="card-section"><div class="card-label">Không liền kề</div><div class="card-row">'+g.single.map(a=>'<div class="mini">'+a+'</div>').join('')+'</div><div class="card-label">Liền kề</div><div class="card-row">'+g.runs.map(a=>'<div class="run">'+a.map(n=>'<div class="mini">'+n+'</div>').join('')+'</div>').join('')+'</div></div>'}function playerCard(p,turn,finished){const chip=p.chips==null?'<span class="secret">🪙 bí mật</span>':'<span class="coins">🪙 '+p.chips+'</span>';return '<div class="player '+(p.id===turn?.id&&!finished&&!room.paused?'turn':'')+'"><div class="phead"><span>'+esc(p.name)+(p.id===me?' <span class="you">· Bạn</span>':'')+'</span>'+chip+'</div>'+cardGroups(p.cards)+(finished?'<div class="you">Điểm: <b>'+p.score+'</b></div>':'')+'</div>'}function renderGame(){const meP=room.players.find(x=>x.id===me),turn=room.players[room.turn],myTurn=turn?.id===me,finished=room.state==='finished',paused=room.paused&&!finished;root.innerHTML='<div class="gamebar"><div class="room">Phòng: <b>'+esc(room.code)+'</b><span>♙ '+room.players.length+'/7</span></div><div class="game-controls"><button class="pause" onclick="pauseGame()">'+(paused?'▶ Tiếp tục':'⏸ Tạm dừng')+'</button><button class="end" onclick="endGame()">■ Kết thúc</button></div></div><section class="layout"><aside class="panel players"><div class="panel-title">Người chơi <span class="deck">· '+room.deckCount+' lá</span></div>'+room.players.map(p=>playerCard(p,turn,finished)).join('')+'</aside><section class="table">'+(paused?'<div class="paused">⏸ TẠM DỪNG</div>':'')+(finished?'<div class="winner">🏆 Ván đã kết thúc</div>':'<div class="turn-title">🎯 <span>Đến lượt:</span> '+esc(turn?.name||'—')+'</div>')+(room.current!=null?'<div class="main-card"><div class="label">LÁ BÀI</div><div class="number">'+room.current+'</div><div class="label">NO THANKS!</div></div>':'')+'<div class="pot">🪙 '+room.pot+' xu trên bàn</div>'+(finished?'<div class="winner">'+esc(room.players.find(x=>x.id===room.winner)?.name||'')+' thắng!</div><button class="replay" onclick="restart()" '+(room.hostId===me?'':'disabled')+'>Chơi lại</button>':'<div class="actions"><button class="action take" onclick="take()" '+(myTurn&&!paused?'':'disabled')+'>Lấy lá bài</button><button class="action pass" onclick="pass()" '+(myTurn&&meP?.chips>0&&!paused?'':'disabled')+'>🪙 Từ chối · −1 xu</button></div><div class="info">Xu của bạn: <b>'+(meP?.chips??'—')+'</b> · Xu của người khác được giữ bí mật.</div>')+'</section><aside class="right"><div class="panel chat"><h3>Trò chuyện</h3><div id="chatLog" class="chat-log">'+(room.chat||[]).map(h=>'<div class="msg '+(h.playerId===me?'me':'')+'"><b>'+esc(h.player)+'</b><span>'+esc(h.text)+'</span></div>').join('')+'</div><form class="chat-form" onsubmit="sendChat(event)"><input id="chatInput" maxlength="300" placeholder="Nhập tin nhắn..."><button>Gửi</button></form></div><div class="panel my">🪙 <b>Xu của bạn: '+(meP?.chips??'—')+'</b><br>Chỉ bạn nhìn thấy số xu này.</div></aside></section>';const log=document.getElementById('chatLog');if(log)log.scrollTop=log.scrollHeight}function sendChat(e){e.preventDefault();const i=document.getElementById('chatInput');if(i.value.trim()){send('chat',{text:i.value.trim()});i.value=''}}function start(){send('start')}function addBot(){send('addBot')}function take(){send('take')}function pass(){send('pass')}function pauseGame(){send('pause')}function endGame(){if(confirm('Kết thúc ván?'))send('end')}function restart(){send('restart')}connect();render();
</script></body></html>
