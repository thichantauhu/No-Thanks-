<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No Thanks! Online</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f6f8;color:#1f2937;min-height:100vh}button,input{font:inherit}button{border:1px solid #d7dbe2;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1220px;margin:auto;padding:20px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand h1{margin:0;font-size:28px}.brand small,.muted{color:#7b8492}.panel{background:#fff;border:1px solid #dfe3e8;border-radius:16px;padding:18px;box-shadow:0 5px 18px #1f29370d}.center{max-width:520px;margin:8vh auto}.field{display:flex;gap:10px;margin:12px 0}.field input{flex:1;background:#fff;color:#1f2937;border:1px solid #cfd5dd;border-radius:10px;padding:12px}.primary{background:#f4c542;color:#1d1b12;border-color:#e4b62e}.secondary{background:#fff;color:#374151}.danger{background:#fff1f2;color:#b42318;border-color:#f1b7bc}.code{font-size:30px;letter-spacing:7px;font-weight:900;background:#fafafa;border:1px dashed #aeb6c2;padding:12px 18px;border-radius:12px;text-align:center}.lobby{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.players{display:grid;gap:9px;margin:15px 0}.player{display:flex;align-items:center;justify-content:space-between;background:#f7f8fa;border:1px solid #e5e7eb;padding:12px 14px;border-radius:11px}.badge{font-size:12px;color:#7b8492}.game{display:grid;grid-template-columns:1fr 330px;gap:16px}.table{min-height:650px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:1px solid #dfe3e8;border-radius:18px;overflow:hidden}.card{width:155px;height:220px;border-radius:16px;background:#fff;color:#171717;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:17px;box-shadow:0 8px 24px #1f29371f;border:4px solid #d8d2bf}.card .num{font-size:68px;font-weight:1000;line-height:1}.card .label{font-weight:900;color:#59564e}.pot{font-size:20px;font-weight:900;margin:18px}.actions{display:flex;gap:12px}.actions button{min-width:145px;font-size:17px}.side{display:flex;flex-direction:column;gap:14px}.side h3{margin:0}.scoreboard{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:start;background:#f7f8fa;border:1px solid #e5e7eb;border-radius:10px;padding:10px}.turn{outline:2px solid #f0c43e;background:#fffdf3}.coins{color:#c68d00;font-weight:900;white-space:nowrap}.cards{display:flex;flex-direction:column;gap:4px;margin-top:7px;max-height:125px;overflow:auto}.mini-card{background:#fff;border:1px solid #cfd5dd;border-radius:6px;padding:4px 8px;font-weight:800;text-align:center;width:48px;box-shadow:0 1px 2px #0000000a}.chat{height:310px;display:flex;flex-direction:column}.chat h3{margin:0 0 10px}.chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:4px 3px;margin-bottom:10px}.msg{max-width:92%;background:#f1f3f6;border-radius:10px;padding:7px 9px;align-self:flex-start}.msg.me{align-self:flex-end;background:#fff4c9}.msg b{display:block;font-size:12px;margin-bottom:2px}.msg span{font-size:13px;word-break:break-word}.chat-form{display:flex;gap:7px}.chat-form input{min-width:0;flex:1;border:1px solid #cfd5dd;border-radius:9px;padding:9px}.chat-form button{padding:9px 13px}.rules{line-height:1.55;font-size:13px;color:#5d6673}.winner{font-size:22px;font-weight:900;color:#c58c00}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}@media(max-width:850px){.lobby,.game{grid-template-columns:1fr}.table{min-height:500px}.app{padding:12px}.card{width:125px;height:175px}.card .num{font-size:54px}.actions button{min-width:0;flex:1}}
</style></head><body><div class="app"><div class="brand"><div><h1>🪙 No Thanks!</h1><small>Chơi online cùng bạn bè</small></div><div id="status" class="muted"></div></div><main id="root"></main></div><div id="notice" class="notice"></div><script>
const root=document.getElementById('root'),notice=document.getElementById('notice'),statusEl=document.getElementById('status');let ws=null,me=null,room=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function toast(s){notice.textContent=s;notice.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>notice.style.display='none',2400)}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>statusEl.textContent='● Đã kết nối';ws.onclose=()=>{statusEl.textContent='○ Mất kết nối';toast('Mất kết nối máy chủ')};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){me=m.playerId;localStorage.setItem('nt_room',m.room);localStorage.setItem('nt_pid',me)}else if(m.type==='state'){room=m.state;render()}else if(m.type==='error')toast(m.message);else if(m.type==='kicked'){toast('Bạn đã bị chủ phòng kick');setTimeout(()=>location.reload(),900)}}}
function send(type,p={}){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type,...p}))}function getName(){const n=document.getElementById('name')?.value.trim()||'Người chơi';localStorage.setItem('nt_name',n);return n}function create(){if(!ws||ws.readyState!==1)return toast('Đang kết nối...');send('create',{name:getName()})}function join(){const n=getName(),c=document.getElementById('code').value.trim().toUpperCase();if(c.length<4)return toast('Nhập mã phòng');send('join',{name:n,code:c})}
function render(){if(!room){root.innerHTML=`<section class="panel center"><h2>Tạo phòng chơi</h2><p class="muted">3–7 người • Realtime • Có thể thêm bot</p><div class="field"><input id="name" maxlength="20" placeholder="Tên của bạn" value="${esc(localStorage.getItem('nt_name')||'')}"/><button class="primary" onclick="create()">Tạo phòng</button></div><div class="field"><input id="code" maxlength="5" placeholder="Mã phòng"/><button class="secondary" onclick="join()">Vào phòng</button></div><div class="rules"><b>Cách chơi:</b> mỗi lượt một lá bài được lật. Bạn chọn <b>LẤY</b> để nhận lá + toàn bộ xu trên bàn, hoặc <b>BỎ</b> để trả 1 xu. Cuối ván, các dãy số liên tiếp chỉ tính lá nhỏ nhất; trừ xu còn lại khỏi điểm. Điểm thấp nhất thắng.</div></section>`;return}if(room.state==='lobby')renderLobby();else renderGame()}
function renderLobby(){const host=room.hostId===me;root.innerHTML=`<section class="lobby"><div class="panel"><div class="topline"><div><h2 style="margin:0">Phòng chờ</h2><span class="muted">Chia sẻ mã này cho bạn bè</span></div><div class="code">${esc(room.code)}</div></div><div class="players">${room.players.map(p=>`<div class="player"><div><b>${esc(p.name)}</b> ${p.id===room.hostId?'👑':''} ${p.id===me?'(Bạn)':''}<div class="badge">${p.bot?'🤖 Bot':'👤 Người chơi'} ${!p.connected&&!p.bot?'• đã ngắt kết nối':''}</div></div>${host&&p.id!==me?`<button class="danger" onclick="kick('${p.id}')">Kick</button>`:''}</div>`).join('')}</div><div class="field"><button class="secondary" onclick="copyCode()">📋 Sao chép mã</button>${host?`<button class="secondary" onclick="addBot()">+ Thêm bot</button><button class="primary" onclick="start()" ${room.players.length<3?'disabled':''}>▶ Bắt đầu</button>`:''}</div><p class="muted">Cần ít nhất 3 người. Tối đa 7 người.</p></div><aside class="panel rules"><h3>Luật nhanh</h3><ol><li>Mỗi người bắt đầu với 11 xu.</li><li>Bộ bài gồm 3–35, bỏ ngẫu nhiên 9 lá.</li><li>Khi lá mới xuất hiện, người tới lượt chọn lấy hoặc bỏ.</li><li>Bỏ = trả 1 xu vào giữa bàn. Hết xu thì bắt buộc lấy.</li><li>Nhận bài sẽ lấy luôn toàn bộ xu giữa bàn.</li><li>Dãy liên tiếp chỉ tính lá nhỏ nhất.</li><li>Điểm thấp nhất thắng.</li></ol></aside></section>`}
function copyCode(){navigator.clipboard?.writeText(room.code);toast('Đã sao chép mã phòng')}function start(){send('start')}function addBot(){send('addBot')}function kick(id){if(confirm('Kick người chơi này?'))send('kick',{playerId:id})}
function cardsColumn(cards){return cards.length?cards.map(n=>`<div class="mini-card">${n}</div>`).join(''):'<span class="muted">Chưa có bài</span>'}
function renderGame(){const p=room.players.find(x=>x.id===me),turn=room.players[room.turn],myTurn=turn?.id===me,finished=room.state==='finished';root.innerHTML=`<section class="game"><div class="table"><div class="muted">${finished?'KẾT THÚC VÁN':myTurn?'ĐẾN LƯỢT BẠN':'Lượt của '+esc(turn?.name||'—')}</div>${room.current!=null?`<div class="card"><div class="label">LÁ BÀI</div><div class="num">${room.current}</div><div class="label">NO THANKS!</div></div>`:`<div class="winner">🏆 Ván đã kết thúc</div>`}<div class="pot">🪙 ${room.pot} xu trên bàn</div>${finished?`<div class="winner">${esc(room.players.find(x=>x.id===room.winner)?.name||'')} thắng!</div>`:`<div class="actions"><button class="primary" onclick="take()" ${myTurn?'':'disabled'}>LẤY BÀI</button><button class="secondary" onclick="pass()" ${myTurn&&p.chips>0?'':'disabled'}>BỎ · −1 🪙</button></div>`}</div><aside class="side"><div class="panel"><div class="topline"><h3>Người chơi</h3><span class="muted">${room.deckCount} lá còn lại</span></div><div class="scoreboard">${room.players.map(x=>`<div class="row ${x.id===turn?.id&&!finished?'turn':''}"><div><b>${esc(x.name)}</b>${x.id===me?' 👤':''}<div class="cards">${cardsColumn(x.cards)}</div></div><div class="coins">🪙 ${x.chips}</div><div>${finished?`<b>${x.score}</b>`:''}</div></div>`).join('')}</div>${finished&&room.hostId===me?`<button class="primary" style="width:100%;margin-top:12px" onclick="restart()">↻ Chơi lại</button>`:''}</div><div class="panel chat"><h3>💬 Chat</h3><div id="chatLog" class="chat-log">${(room.chat||[]).map(h=>`<div class="msg ${h.playerId===me?'me':''}"><b>${esc(h.player)}${h.playerId===me?' · Bạn':''}</b><span>${esc(h.text)}</span></div>`).join('')}</div><form class="chat-form" onsubmit="sendChat(event)"><input id="chatInput" maxlength="300" autocomplete="off" placeholder="Nhập tin nhắn..."/><button class="primary">Gửi</button></form></div><div class="panel rules"><b>Bạn:</b> ${esc(p?.name)}<br><b>Xu:</b> ${p?.chips} 🪙<br><b>Bài của bạn:</b><div class="cards">${cardsColumn(p?.cards||[])}</div></div></aside></section>`;const log=document.getElementById('chatLog');if(log)log.scrollTop=log.scrollHeight}
function sendChat(e){e.preventDefault();const input=document.getElementById('chatInput');if(input?.value.trim()){send('chat',{text:input.value.trim()});input.value='';input.focus()}}function take(){send('take')}function pass(){send('pass')}function restart(){send('restart')}
connect();render();
</script></body></html>
