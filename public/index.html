<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No Thanks! Online</title><style>
*{box-sizing:border-box}:root{--text:#20242a;--muted:#7b8189;--line:#e8eaed;--yellow:#f4c542;--green:#18a968;--red:#e94b4b}body{margin:0;background:#fff;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1280px;margin:auto;padding:16px 20px}.top{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.logo{font-size:26px}.brand h1{font-size:23px;margin:0}.muted,.status{color:var(--muted);font-size:12px}.panel{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}.center{max-width:520px;margin:8vh auto}.field{display:flex;gap:8px;margin:10px 0}.field input{flex:1;border:1px solid #d9dde2;border-radius:9px;padding:11px}.primary{background:var(--yellow);border-color:var(--yellow)}.code{font-size:20px;letter-spacing:4px;font-weight:850;background:#f6f7f9;padding:9px 14px;border-radius:8px;text-align:center}.lobby{display:grid;grid-template-columns:1.45fr .8fr;gap:14px}.players{display:grid;gap:6px;margin:14px 0}.player{display:flex;align-items:center;justify-content:space-between;background:#fafbfc;border:1px solid var(--line);padding:10px 12px;border-radius:9px}.badge{font-size:11px;color:var(--muted);margin-top:2px}.danger{color:#c83c3c;border-color:#f0caca}.rules{font-size:13px;line-height:1.55;color:#5e6369}.rules h3{margin-top:0;color:var(--text)}
.gamebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.room{background:#f6f7f9;border-radius:10px;padding:10px 16px;color:#69717b;font-size:13px}.room b{color:#1e4f9a;letter-spacing:1px}.game-controls{display:flex;gap:7px}.pause{background:var(--green);border-color:var(--green);color:#fff}.end{background:var(--red);border-color:var(--red);color:#fff}.layout{display:grid;grid-template-columns:275px minmax(440px,1fr) 300px;gap:12px}.players-panel{padding:12px}.panel-title{font-size:16px;font-weight:850;margin:0 0 10px}.p{padding:10px 9px;border:1px solid transparent;border-radius:9px;margin-bottom:6px;background:#fafbfc}.p.turn{border-color:#e7c34b;background:#fffdf4}.phead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}.coins{font-size:13px;color:#d39400}.secret{font-size:11px;color:#9aa0a7}.card-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.mini{min-width:38px;text-align:center;background:#fff;border:1px solid #d9dde2;border-radius:6px;padding:5px 7px;font-size:12px;font-weight:800}.run{display:flex;gap:2px;background:#fff5f5;border:2px solid var(--red);border-radius:7px;padding:2px}.mini.first{background:#ffdede;border-color:var(--red);color:#b42323;font-weight:950}.table{min-height:600px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative}.turn-title{font-size:15px;font-weight:850;margin-bottom:22px}.main-card{width:185px;height:255px;border:1px solid #d9dadd;border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px;box-shadow:0 7px 20px rgba(0,0,0,.06)}.main-card .label{font-size:10px;color:#a0a4aa;letter-spacing:1.2px;font-weight:800}.main-card .number{font-size:76px;font-weight:950}.pot{margin:16px 0 20px;font-size:14px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(440px,100%)}.action{font-size:14px;padding:13px 10px;color:#fff;border-color:transparent}.take{background:var(--green)}.pass{background:var(--red)}.paused{position:absolute;top:16px;color:#9b7612;font-size:11px;font-weight:900}.winner{font-size:21px;font-weight:900;margin:15px}.right{display:flex;flex-direction:column;gap:12px}.chat{height:365px;padding:12px;display:flex;flex-direction:column}.chat h3{font-size:16px;margin:0 0 10px}.chat-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}.msg{font-size:12px;background:#f4f5f7;border-radius:9px;padding:7px 9px}.msg.me{align-self:flex-end;background:#fff7d7}.msg b{display:block;font-size:11px}.chat-form{display:flex;gap:6px;margin-top:8px}.chat-form input{min-width:0;flex:1;border:1px solid #d9dde2;border-radius:8px;padding:8px}.chat-form button{padding:8px 12px;background:#2374d8;color:#fff;border-color:#2374d8}.my{padding:12px;font-size:12px;line-height:1.7}.notice{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#20242a;color:#fff;border-radius:8px;padding:9px 14px;font-size:12px;z-index:5}@media(max-width:1050px){.layout{grid-template-columns:240px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}}@media(max-width:760px){.app{padding:10px}.lobby{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.right{display:flex;grid-column:auto}.gamebar{flex-wrap:wrap}.room{width:100%;text-align:center}.table{min-height:500px}.actions{width:100%}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">🪙</div><div><h1>No Thanks!</h1><small class="muted">Chơi online cùng bạn bè</small></div></div><div id="status" class="status"></div></header><main id="root"></main></div><div id="notice" class="notice"></div><script>
const root=document.getElementById('root'),notice=document.getElementById('notice'),statusEl=document.getElementById('status');let ws=null,me=null,room=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function toast(s){notice.textContent=s;notice.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>notice.style.display='none',2300)}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>statusEl.textContent='● Đã kết nối';ws.onclose=()=>statusEl.textContent='○ Mất kết nối';ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){me=m.playerId;localStorage.setItem('nt_name',document.getElementById('name')?.value||'')}else if(m.type==='state'){room=m.state;render()}else if(m.type==='error')toast(m.message);else if(m.type==='kicked'){toast('Bạn đã bị kick');setTimeout(()=>location.reload(),700)}}}function send(type,p={}){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type,...p}))}function name(){return document.getElementById('name')?.value.trim()||localStorage.getItem('nt_name')||'Người chơi'}function create(){send('create',{name:name()})}function join(){const c=document.getElementById('code').value.trim().toUpperCase();if(c.length<4)return toast('Nhập mã phòng');send('join',{name:name(),code:c})}function render(){if(!room){root.innerHTML='<section class="panel center"><h2>Tạo phòng chơi</h2><p class="muted">3–7 người · Realtime · Có thể thêm bot</p><div class="field"><input id="name" maxlength="20" placeholder="Tên của bạn" value="'+esc(localStorage.getItem('nt_name')||'')+'"><button class="primary" onclick="create()">Tạo phòng</button></div><div class="field"><input id="code" maxlength="5" placeholder="Mã phòng"><button onclick="join()">Vào phòng</button></div><div class="rules"><b>Luật nhanh:</b> Lấy bài = nhận lá + xu trên bàn. Từ chối = bỏ 1 xu. Dãy liên tiếp chỉ tính lá nhỏ nhất. Trừ xu còn lại, điểm thấp nhất thắng.</div></section>';return}if(room.state==='lobby')lobby();else game()}function lobby(){const host=room.hostId===me;root.innerHTML='<section class="lobby"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h2 style="margin:0">Phòng chờ</h2><span class="muted">Chia sẻ mã này cho bạn bè</span></div><div class="code">'+esc(room.code)+'</div></div><div class="players">'+room.players.map(p=>'<div class="player"><div><b>'+esc(p.name)+'</b> '+(p.id===room.hostId?'👑':'')+(p.id===me?' (Bạn)':'')+'<div class="badge">'+(p.bot?'🤖 Bot':'👤 Người chơi')+'</div></div>'+(host&&p.id!==me?'<button class="danger" onclick="kick(\''+p.id+'\')">Kick</button>':'')+'</div>').join('')+'</div><div class="field"><button onclick="navigator.clipboard?.writeText(room.code);toast(\'Đã sao chép mã\')">Sao chép mã</button>'+(host?'<button onclick="send(\'addBot\')">+ Thêm bot</button><button class="primary" onclick="send(\'start\')" '+(room.players.length<3?'disabled':'')+'>Bắt đầu</button>':'')+'</div><p class="muted">Cần ít nhất 3 người · tối đa 7 người</p></div><aside class="panel rules"><h3>Luật chơi</h3><ol><li>Mỗi người 11 xu.</li><li>33 lá từ 3–35, bỏ ngẫu nhiên 9 lá.</li><li>Từ chối = đặt 1 xu lên lá và chuyển lượt.</li><li>Hết xu thì bắt buộc lấy.</li><li>Lấy bài nhận cả xu trên lá.</li><li>Chuỗi liên tiếp chỉ tính lá nhỏ nhất.</li><li>Điểm thấp nhất thắng.</li></ol></aside></section>'}function kick(id){if(confirm('Kick người chơi này?'))send('kick',{playerId:id})}function groups(cards){const s=[...(cards||[])].sort((a,b)=>a-b),one=[],runs=[];let i=0;while(i<s.length){let j=i;while(j+1<s.length&&s[j+1]===s[j]+1)j++;const g=s.slice(i,j+1);(g.length===1?one:runs).push(g);i=j+1}return{one,runs}}function cards(c){const g=groups(c);return '<div class="card-row">'+g.one.map(n=>'<div class="mini">'+n+'</div>').join('')+g.runs.map(r=>'<div class="run">'+r.map((n,i)=>'<div class="mini '+(i===0?'first':'')+'">'+n+'</div>').join('')+'</div>').join('')+'</div>'}function game(){const mep=room.players.find(x=>x.id===me),turn=room.players[room.turn],my=turn?.id===me,fin=room.state==='finished',paused=room.paused&&!fin;root.innerHTML='<div class="gamebar"><div class="room">Phòng: <b>'+esc(room.code)+'</b> · '+room.players.length+'/7</div><div class="game-controls"><button class="pause" onclick="send(\'pause\')">'+(paused?'Tiếp tục':'Tạm dừng')+'</button><button class="end" onclick="confirm(\'Kết thúc ván?\')&&send(\'end\')">Kết thúc</button></div></div><section class="layout"><aside class="panel players-panel"><div class="panel-title">Người chơi <span class="muted">· '+room.deckCount+' lá</span></div>'+room.players.map(p=>'<div class="p '+(p.id===turn?.id&&!fin&&!paused?'turn':'')+'"><div class="phead"><span>'+esc(p.name)+(p.id===me?' · Bạn':'')+'</span><span class="'+(p.id===me?'coins':'secret')+'">'+(p.id===me?'🪙 '+p.chips:'🪙 bí mật')+'</span></div>'+cards(p.cards)+(fin?'<div class="muted">Điểm: <b>'+p.score+'</b></div>':'')+'</div>').join('')+'</aside><section class="table">'+(paused?'<div class="paused">⏸ TẠM DỪNG</div>':'')+(fin?'<div class="winner">🏆 '+esc(room.players.find(x=>x.id===room.winner)?.name||'')+' thắng!</div>':'<div class="turn-title">🎯 Đến lượt: '+esc(turn?.name||'—')+'</div>')+(room.current!=null?'<div class="main-card"><div class="label">LÁ BÀI</div><div class="number">'+room.current+'</div><div class="label">NO THANKS!</div></div>':'')+'<div class="pot">🪙 '+room.pot+' xu trên bàn</div>'+(fin?'<button class="primary" onclick="send(\'restart\')" '+(room.hostId===me?'':'disabled')+'>Chơi lại</button>':'<div class="actions"><button class="action take" onclick="send(\'take\')" '+(my&&!paused?'':'disabled')+'>Lấy lá bài</button><button class="action pass" onclick="send(\'pass\')" '+(my&&mep?.chips>0&&!paused?'':'disabled')+'>🪙 Từ chối · −1 xu</button></div>')+'</section><aside class="right"><div class="panel chat"><h3>Trò chuyện</h3><div id="chat" class="chat-log">'+(room.chat||[]).map(h=>'<div class="msg '+(h.playerId===me?'me':'')+'"><b>'+esc(h.player)+'</b>'+esc(h.text)+'</div>').join('')+'</div><form class="chat-form" onsubmit="chat(event)"><input id="msg" maxlength="300" placeholder="Nhập tin nhắn..."><button>Gửi</button></form></div><div class="panel my">🪙 <b>Xu của bạn: '+mep?.chips+'</b><br>Xu của người khác được giữ bí mật.</div></aside></section>'}function chat(e){e.preventDefault();const i=document.getElementById('msg');if(i.value.trim())send('chat',{text:i.value.trim()});i.value=''}connect();render();</script></body></html>
